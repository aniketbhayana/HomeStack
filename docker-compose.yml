version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: homestack-db
    environment:
      POSTGRES_USER: homestack
      POSTGRES_PASSWORD: homestack_dev
      POSTGRES_DB: homestack
    ports:
      - "5432:5432"
    volumes:
      - homestack_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: homestack-redis
    ports:
      - "6379:6379"

volumes:
  homestack_postgres_data: